name: Update asset manifest

# Runs whenever files in /assets change, so you never have to hand-edit
# manifest.json after dropping in new images.
on:
  push:
    paths:
      - 'assets/**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate manifest.json
        run: |
          cd assets
          # List image files, excluding the template and the manifest itself,
          # and write them out as a JSON array.
          python3 -c "
          import json, os
          files = sorted(
              f for f in os.listdir('.')
              if f.lower().endswith(('.png', '.jpg', '.jpeg', '.webp', '.gif'))
              and f != 'template.png'
          )
          with open('manifest.json', 'w') as out:
              json.dump(files, out, indent=2)
              out.write('\n')
          "

      - name: Commit manifest if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/manifest.json
          git diff --staged --quiet || git commit -m "Update assets/manifest.json"
          git push
