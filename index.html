<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Defense Card Generator</title>
<script>
  // Applied before the stylesheet paints, so there's no flash of the
  // wrong theme. Defaults to dark mode if nothing has been saved yet.
  (function () {
    var saved = localStorage.getItem("theme");
    document.documentElement.setAttribute("data-theme", saved === "light" ? "light" : "dark");
  })();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap">

  <header>
    <div class="header-row">
      <div>
        <h1>Defense Card Generator</h1>
        <p>Fill in the fields, pick a defense, then download the result.</p>
      </div>
      <button type="button" id="theme-toggle" aria-label="Toggle light/dark mode"></button>
    </div>
  </header>

  <div class="layout">

    <!-- FORM -->
    <form id="card-form" class="panel">

      <div class="field">
        <label for="f-level">Level</label>
        <select id="f-level">
          <option value="1" selected>1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="Max">Max</option>
        </select>
      </div>

      <div class="field">
        <label for="f-defense">Defense <span class="hint">(fills in Mana, DU, Hero and Targeting Priority — still editable after)</span></label>
        <select id="f-defense">
          <option value="" selected>-- Select Defense --</option>
        </select>
      </div>

      <div class="field toggle-field">
        <label for="f-fusion">
          <span>Fusion <span class="hint">(uses fusion-template.png when on, template.png when off)</span></span>
          <span class="switch">
            <input type="checkbox" id="f-fusion" checked>
            <span class="slider"></span>
          </span>
        </label>
      </div>

      <hr class="divider">

      <div class="field">
        <label for="f-mana">Mana <span class="hint">(auto-fill)</span></label>
        <input type="text" id="f-mana" value="" inputmode="numeric" placeholder="—">
      </div>

      <div class="field">
        <label for="f-du">DU <span class="hint">(auto-fill)</span></label>
        <input type="text" id="f-du" value="" inputmode="numeric" placeholder="—">
      </div>

      <div class="field">
        <label for="f-hero">Hero <span class="hint">(auto-fill, required)</span></label>
        <select id="f-hero" required>
          <option value="" selected>-- Select Hero --</option>
        </select>
      </div>

      <div class="field">
        <label for="f-targeting">Targeting Priority</label>
        <select id="f-targeting">
          <option value="Air">Air</option>
          <option value="Special" selected>Special</option>
          <option value="Fodder">Fodder</option>
          <option value="Strong">Strong</option>
          <option value="Any">Any</option>
          <option value="N/A">N/A</option>
        </select>
      </div>

      <hr class="divider">

      <div class="field">
        <label for="f-fusion-req">Fusion Requirement <span class="hint">(pick a suggestion or type your own)</span></label>
        <input type="text" id="f-fusion-req" list="dl-fusion-req" value="" maxlength="30">
        <datalist id="dl-fusion-req">
          <option value="Required">
          <option value="Optional">
          <option value="Highly Recommended">
          <option value="Recommended">
        </datalist>
      </div>

      <div class="field">
        <label for="f-rune-req">Rune Requirement <span class="hint">(pick a suggestion or type your own)</span></label>
        <input type="text" id="f-rune-req" list="dl-rune-req" value="" maxlength="30">
        <datalist id="dl-rune-req">
          <option value="Required">
          <option value="Optional">
          <option value="Highly Recommended">
          <option value="Recommended">
          <option value="Don't use">
        </datalist>
      </div>

      <hr class="divider">

      <div class="field">
        <label for="f-power">Power</label>
        <input type="text" id="f-power" inputmode="numeric" value="0">
      </div>

      <div class="field">
        <label for="f-range">Range</label>
        <input type="text" id="f-range" inputmode="numeric" value="0">
      </div>

      <div class="field">
        <label for="f-defrate">Def. Rate</label>
        <input type="text" id="f-defrate" inputmode="numeric" value="0">
      </div>

      <div class="field">
        <label for="f-fortify">Fortify</label>
        <input type="text" id="f-fortify" inputmode="numeric" value="0">
      </div>

      <div class="field">
        <label for="f-defdamage">Def. Damage <span class="hint">(%, up to 3 decimals)</span></label>
        <input type="text" id="f-defdamage" inputmode="decimal" value="0">
      </div>

      <hr class="divider">

      <div class="field">
        <label for="f-asset">Icon asset</label>
        <select id="f-asset"></select>
      </div>

      <div class="field checkbox-field">
        <label for="f-grid"><input type="checkbox" id="f-grid"> Show position grid (for lining up coordinates)</label>
      </div>

      <button type="button" id="download-btn">Download PNG</button>

    </form>

    <!-- PREVIEW -->
    <div class="panel preview-panel">
      <canvas id="card-canvas" width="360" height="430"></canvas>
      <p class="coord-readout" id="coord-readout">Click anywhere on the image to read its x, y coordinates.</p>
    </div>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
