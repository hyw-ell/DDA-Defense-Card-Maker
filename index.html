<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Defense Card Generator</title>
<script>
  // Applied before the stylesheet paints, so there's no flash of the
  // wrong theme. Defaults to dark mode if nothing has been saved yet.
  (function () {
    var saved = localStorage.getItem("theme");
    document.documentElement.setAttribute("data-theme", saved === "light" ? "light" : "dark");
  })();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap">

  <header>
    <div class="header-row">
      <div>
        <h1>Defense Card Generator</h1>
        <p>Fill in the fields, pick a defense, then download the result.</p>
      </div>
      <button type="button" id="theme-toggle" aria-label="Toggle light/dark mode"></button>
    </div>
  </header>

  <div class="layout">

    <!-- FORM -->
    <form id="card-form" class="panel">

      <!-- Section 1: Defense + Fusion -->
      <div class="field">
        <label for="f-defense">Defense</label>
        <select id="f-defense" required>
          <option value="" selected>-- Select Defense --</option>
        </select>
      </div>

      <div class="field toggle-field">
        <label for="f-fusion">
          <span>Fusion</span>
          <span class="switch">
            <input type="checkbox" id="f-fusion" checked>
            <span class="slider"></span>
          </span>
        </label>
      </div>

      <hr class="divider">

      <!-- Section 2: Requirements + Targeting -->
      <div class="field">
        <label for="f-fusion-req">Fusion Requirement</label>
        <input type="text" id="f-fusion-req" list="dl-fusion-req" value="" maxlength="30" required placeholder="e.g. Required">
        <datalist id="dl-fusion-req">
          <option value="Required">
          <option value="Optional">
          <option value="Highly Recommended">
          <option value="Recommended">
        </datalist>
      </div>

      <div class="field">
        <label for="f-rune-req">Rune Requirement</label>
        <input type="text" id="f-rune-req" list="dl-rune-req" value="" maxlength="30" required placeholder="e.g. Required">
        <datalist id="dl-rune-req">
          <option value="Required">
          <option value="Optional">
          <option value="Highly Recommended">
          <option value="Recommended">
          <option value="Don't use">
        </datalist>
      </div>

      <div class="field">
        <label for="f-targeting">Targeting Priority</label>
        <select id="f-targeting" required>
          <option value="Air">Air</option>
          <option value="Special" selected>Special</option>
          <option value="Fodder">Fodder</option>
          <option value="Strong">Strong</option>
          <option value="Any">Any</option>
          <option value="N/A">N/A</option>
        </select>
      </div>

      <hr class="divider">

      <!-- Section 3: Defense stats -->
      <div class="field">
        <label for="f-power">Power</label>
        <input type="text" id="f-power" inputmode="numeric" value="" placeholder="e.g. 1500">
      </div>

      <div class="field">
        <label for="f-range">Range</label>
        <input type="text" id="f-range" inputmode="numeric" value="" placeholder="e.g. 12">
      </div>

      <div class="field">
        <label for="f-defrate">Def. Rate</label>
        <input type="text" id="f-defrate" inputmode="numeric" value="" placeholder="e.g. 500">
      </div>

      <div class="field">
        <label for="f-fortify">Fortify</label>
        <input type="text" id="f-fortify" inputmode="numeric" value="" placeholder="e.g. 3">
      </div>

      <div class="field">
        <label for="f-defdamage">Def. Damage</label>
        <input type="text" id="f-defdamage" inputmode="decimal" value="" placeholder="e.g. 12.345">
      </div>

      <hr class="divider">

      <!-- Additional Options (rarely need to change) -->
      <details class="additional-options">
        <summary>Additional Options</summary>

        <div class="field">
          <label for="f-level">Level</label>
          <select id="f-level">
            <option value="1" selected>1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="Max">Max</option>
          </select>
        </div>

        <div class="field">
          <label for="f-mana">Mana</label>
          <input type="text" id="f-mana" value="" inputmode="numeric" placeholder="—">
        </div>

        <div class="field">
          <label for="f-du">DU</label>
          <input type="text" id="f-du" value="" inputmode="numeric" placeholder="—">
        </div>

        <div class="field">
          <label for="f-hero">Hero</label>
          <select id="f-hero">
            <option value="" selected>-- Select Hero --</option>
          </select>
        </div>

        <div class="field">
          <label for="f-asset">Defense Icon</label>
          <select id="f-asset"></select>
        </div>
      </details>

      <button type="button" id="download-btn">Download PNG</button>

    </form>

    <!-- PREVIEW -->
    <div class="panel preview-panel">
      <canvas id="card-canvas" width="360" height="430"></canvas>
    </div>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
